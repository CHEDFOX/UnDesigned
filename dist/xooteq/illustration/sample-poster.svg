<text font-family="Jost, Futura, 'Century Gothic', 'Avenir Next', sans-serif" font-weight="700" font-size="21.1" letter-spacing="-0.4" fill="#ffffff"><tspan x="28" y="488">so you can ship something</tspan><tspan x="28" y="509.522">that actually matters.</tspan></text>
<text x="28" y="535.5219999999999" font-family="Jost, Futura, 'Century Gothic', 'Avenir Next', sans-serif" font-weight="400" font-size="11.5" letter-spacing="0.3" fill="#f15a30">Modernism in the service of selling, as in the posters of Cassandre, Kauffer, Bernhard, Matter and Beall. One product or symbol as the hero, shown big and from a bold viewpoint; strong diagonals and a low horizon; smooth airbrushed modelling between the colours of one Wada combination; geometric lettering built into the image; a short slogan and the brand name set large.</text>
