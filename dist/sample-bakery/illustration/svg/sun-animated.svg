<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" class="ud-ill ud-ill-sun" role="img" aria-label="sun illustration"><style>
.ud-ill-sun .ud-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:ud-draw-sun 600ms cubic-bezier(0.65, 0, 0.35, 1) both}
.ud-ill-sun .ud-pop{transform-box:fill-box;transform-origin:center;animation:ud-pop-sun 320ms cubic-bezier(0.34, 1.56, 0.64, 1) both}
@keyframes ud-draw-sun{to{stroke-dashoffset:0}}
@keyframes ud-pop-sun{from{transform:scale(0)}to{transform:scale(1)}}
.ud-ill-sun .ud-ray{animation:ud-radiate-sun 1800ms cubic-bezier(0.33, 0, 0.67, 1) 200ms infinite both}
