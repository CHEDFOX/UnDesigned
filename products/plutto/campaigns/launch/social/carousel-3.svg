<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img" aria-labelledby="pl-carousel-3-title"><title id="pl-carousel-3-title">Enter your birth once. Then ask. Plutto. Interrupt it, hold it, switch traditions mid-sentence. Your memory is kept.</title><style>@import url("https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Instrument+Sans:wght@400;600&amp;display=swap");</style><rect width="1080" height="1350" fill="#111314"/><ellipse cx="0" cy="2187" rx="2754" ry="1161" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.55"/><circle cx="518.4" cy="1046.8" r="70" fill="#cab356"/><text x="108" y="165.6" font-family="'Instrument Serif', Georgia, serif" font-size="80" fill="#ffffff">Enter your birth once.</text><text x="108" y="251.6" font-family="'Instrument Serif', Georgia, serif" font-size="80" fill="#ffffff">Then ask.</text><circle cx="119.8" cy="317.7" r="10.6" fill="none" stroke="#ffffff" stroke-width="2.1"/><circle cx="119.8" cy="317.7" r="2.8" fill="#ffffff"/><text x="142.2" y="327.8" font-family="'Instrument Sans', system-ui, sans-serif" font-size="28" font-weight="600" letter-spacing="0.6" fill="#ffffff">Plutto</text><text x="108" y="417.7" font-family="'Instrument Sans', system-ui, sans-serif" font-size="36" fill="#ffffff">Interrupt it, hold it, switch</text><text x="108" y="468.1" font-family="'Instrument Sans', system-ui, sans-serif" font-size="36" fill="#ffffff">traditions mid-sentence. Your</text><text x="108" y="518.5" font-family="'Instrument Sans', system-ui, sans-serif" font-size="36" fill="#ffffff">memory is kept.</text><text x="972" y="1242" font-family="'Instrument Sans', system-ui, sans-serif" font-size="28" text-anchor="end" fill="#ffffff">3 / 4</text></svg>
