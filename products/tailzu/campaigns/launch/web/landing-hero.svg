<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" width="1440" height="810" role="img" aria-labelledby="tz-hero-title"><title id="tz-hero-title">Talk. It writes. Tailzu.</title><style><![CDATA[@import url("https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Caveat:wght@400;700&display=swap");]]></style><rect width="1440" height="810" fill="#fdc57e"/><g transform="translate(64.8 64.8) scale(0.06641) translate(-170 -228)"><line x1="346" y1="402" x2="270" y2="598" stroke="#111314" stroke-width="21.1" stroke-linecap="round"/><line x1="444" y1="394" x2="554" y2="486" stroke="#111314" stroke-width="30" stroke-dasharray="9 11"/><line x1="668" y1="478" x2="828" y2="243" stroke="#111314" stroke-width="21.1" stroke-linecap="round"/><circle cx="828" cy="243" r="27.4" fill="#111314"/><rect x="308" y="269" width="132" height="132" rx="28" fill="#111314"/><rect x="558" y="478" width="132" height="132" rx="28" fill="#111314"/><rect x="178" y="598" width="132" height="132" rx="28" fill="#111314"/></g><text font-family="'Instrument Sans', system-ui, sans-serif" font-weight="600" font-size="26" fill="#111314"><tspan x="119.5" y="91.3">Tailzu</tspan></text><text font-family="'Instrument Serif', Georgia, serif" font-weight="400" font-size="88" letter-spacing="-0.9" fill="#111314"><tspan x="64.8" y="283.3">Talk. It writes.</tspan></text><text font-family="'Instrument Sans', system-ui, sans-serif" font-weight="500" font-size="22" fill="#111314"><tspan x="64.8" y="347.3">Speak Hindi, Hinglish or any of 22 Indian languages,</tspan><tspan x="64.8" y="380.3">and clean, ready-to-send text lands in any app.</tspan></text><text font-family="'Instrument Sans', system-ui, sans-serif" font-weight="500" font-size="18" fill="#111314"><tspan x="64.8" y="424.3">Filler goes, punctuation comes in, and names and amounts stay as</tspan><tspan x="64.8" y="452.2">you said them. iPhone, Android, Windows and Mac. 8