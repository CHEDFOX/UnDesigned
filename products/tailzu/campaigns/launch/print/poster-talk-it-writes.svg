ds a month, free.</tspan></text><text font-family="'Instrument Sans', system-ui, sans-serif" font-weight="600" font-size="30" fill="#111314"><tspan x="80" y="1324">Download free at tailzu.space</tspan></text><path d="M80 1333.6C87.8 1333.6 111.4 1333.6 126.7 1333.7C142.1 1333.8 156.6 1334.3 172.1 1334.4C187.6 1334.6 204.4 1334.6 219.8 1334.5C235.3 1334.4 249.3 1333.6 264.8 1333.6C280.3 1333.6 297.1 1334.2 312.7 1334.4C328.3 1334.6 343 1334.8 358.3 1334.7C373.7 1334.6 389.2 1333.9 404.6 1333.8C420 1333.6 435 1333.7 450.5 1333.9C466 1334.1 489.7 1334.7 497.5 1334.8" fill="none" stroke="#111314" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
