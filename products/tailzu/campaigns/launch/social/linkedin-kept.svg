oke-linejoin="round"/><path d="M732.4 373.1C734.3 372.7 737.4 372.7 739 373.9C740.6 375.1 741.9 378.3 742 380.2C742 382.1 740.8 384.2 739.2 385.3C737.7 386.3 734.5 386.9 732.6 386.6C730.6 386.4 728.6 385.3 727.7 383.6C726.9 381.9 726.8 378.3 727.6 376.5C728.4 374.8 730.5 373.6 732.4 373.1Z" fill="#f99d1b"/><text font-family="'Caveat', cursive" font-weight="500" font-size="50" fill="#064f6e"><tspan x="524" y="590">kept, exactly as you said</tspan></text><path d="M512 560C504.9 557.2 483.2 547.3 469.5 543.3C455.7 539.3 443.1 539.6 429.5 535.9C415.8 532.3 398.3 529.5 387.7 521.2C377.2 513 374.6 497.7 366.1 486.4C357.7 475.2 345.4 463.8 337 453.7C328.7 443.7 319.5 430.6 316 426" fill="none" stroke="#111314" stroke-width="16.2" stroke-linecap="round" stroke-linejoin="round"/><text font-family="'Instrument Serif', Georgia, serif" font-weight="400" font-size="76" fill="#064f6e"><tspan x="86" y="760">Your words, minus the ums.</tspan><tspan x="86" y="837.5">Nothing else changes.</tspan></text><text font-family="'Instrument Sans', system-ui, sans-serif" font-weight="500" font-size="32" fill="#064f6e"><tspan x="86" y="906">Tailzu cleans what you say. It never rewrites it.</tspan></text><text font-family="'Instrument Sans', system-ui, sans-serif" font-weight="400" font-size="32" fill="#064f6e"><tspan x="86" y="962">Names stay. 2500 stays 2500. Hinglish stays Hinglish.</tspan><tspan x="86" y="1007.4">Audio is deleted once it's written; it isn't stored by default.</tspan></text><g><svg x="86" y="1233.2" width="42" height="42" viewBox="0 0 1000 1000" aria-hidden="true"><rect width="1000" height="1000" fill="#0F0D0B"/> <svg x="70" y="176" width="860" height="648" viewBox="170 228 680 512"> <line x1="346" y1="402" x2="270" y2="598" stroke="#E9CBA2" stroke-width="9" stroke-linecap="round"/> <line x1="444" y1="394" x2="554" y2="486" stroke="#E8A23C" stroke-width="30" stroke-dasharray="9 11"/> <line x1="668" y1="478" x2="828" y2="243" stroke="#C77A3A" stroke-width="9" stroke-linecap="